name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer "cython<3"
      - name: Build debug APK
        run: |
          set +e
          buildozer -v android debug > build.log 2>&1
          code=$?
          echo "=== LAST ERRORS ==="
          grep -n -i -E "error|failed|not found|Traceback" build.log | tail -40
          echo "=== LAST 40 LINES ==="
          tail -40 build.log
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: amir-apk
          path: bin/*.apk
